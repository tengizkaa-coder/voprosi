name: Publish Mini App
on:
  push:
    branches: ['arena/4bfa5c31-voprosi']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/voprosi/
        env:
          VITE_API_URL: https://icleianorxfnwbpylelw.supabase.co/functions/v1/couple-api
      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Pages needs owner setup
        if: steps.pages.outcome != 'success'
        run: echo "Mini App built and tested. Enable Settings > Pages > GitHub Actions, then re-run this workflow. No permanent site was deployed." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
